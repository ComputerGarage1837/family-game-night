name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test game engine
        run: ./gradlew :core:test

      - name: Set up release signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/family-game-night-v1.0.${VERSION_CODE}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: family-game-night-v1.0.${{ github.run_number }}
          path: out/*.apk

      # A fixed, no-login download link for the newest build of any branch:
      # https://github.com/<owner>/<repo>/releases/download/test-build/family-game-night-test.apk
      # (Pre-release, so the in-app updater ignores it.)
      - name: Publish test build
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp out/*.apk out/family-game-night-test.apk
          gh release view test-build >/dev/null 2>&1 || \
            gh release create test-build --prerelease --target "$GITHUB_SHA" \
              --title "Test build (automatic)" \
              --notes "The newest build from any branch, for trying things out. Not an official release."
          gh release upload test-build out/family-game-night-test.apk --clobber

      - name: Render table screenshots
        continue-on-error: true
        run: TABLE_PREVIEW=1 CORE_ONLY=1 ./gradlew :tools:table-preview:run --args="$PWD/out/screenshots"

      - uses: actions/upload-artifact@v4
        with:
          name: table-screenshots
          path: out/screenshots/*.png
          if-no-files-found: ignore

      # Keep the latest table screenshots on a pre-release so they're easy to look at.
      # (The app's updater only looks at full releases, so this never shows up as an update.)
      - name: Publish table screenshots
        if: github.event_name == 'push' && hashFiles('out/screenshots/*.png') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view table-screenshots >/dev/null 2>&1 || \
            gh release create table-screenshots --prerelease --target "$GITHUB_SHA" \
              --title "Table screenshots (automatic)" \
              --notes "Rendered by CI from the latest push. Not an app release."
          gh release upload table-screenshots out/screenshots/*.png --clobber

      # Every push to the main branch becomes a GitHub Release, which the app's updater picks up.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$HAS_SIGNING_KEY" != "true" ]; then
            echo "::warning::No signing key secrets set, so no release was published. See README → 'Turning on auto-updates'."
            exit 0
          fi
          gh release create "v1.0.${VERSION_CODE}" out/*.apk \
            --title "Family Game Night 1.0.${VERSION_CODE}" \
            --notes "$(git log -1 --pretty=%B | head -20)"
